<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Cradle Saints</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .admin-login {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background: #f4f7fa;
            box-sizing: border-box;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
        }

        .login-box h1 {
            margin: 0 0 8px;
            color: #174a7c;
            font-size: 28px;
            text-align: center;
        }

        .login-box .subtitle {
            margin: 0 0 30px;
            color: #666;
            text-align: center;
            font-size: 14px;
        }

        .login-form label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-size: 14px;
            font-weight: 600;
        }

        .login-form input {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 18px;
            border: 1px solid #d5dce3;
            border-radius: 7px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .login-form input:focus {
            outline: none;
            border-color: #174a7c;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #174a7c;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #123b63;
        }

        .login-message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <section class="admin-login">

        <div class="login-box">

            <h1>Cradle Saints</h1>

            <p class="subtitle">
                School Administration
            </p>

            <form class="login-form" id="loginForm">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit" class="login-btn">
                    Login
                </button>
                <a href="#" id="forgotPassword" class="forgot-password">
    Forgot Password?
</a>

                <p class="login-message" id="loginMessage"></p>

            </form>

        </div>

    </section>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>

</html>
